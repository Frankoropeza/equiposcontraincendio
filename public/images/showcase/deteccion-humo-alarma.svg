<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-label="Imagen próximamente — CONINC">
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1f3f6"/>
    </linearGradient>
    <filter id="psh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#14181f" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Fondo neutro -->
  <rect width="800" height="500" fill="url(#pbg)"/>
  <!-- Barra de marca -->
  <rect width="800" height="9" fill="#c62828"/>

  <!-- Marco punteado tipo "imagen vacía" -->
  <rect x="40" y="42" width="720" height="416" rx="20" fill="none" stroke="#d6dae1" stroke-width="3" stroke-dasharray="12 12"/>

  <!-- Tile + icono de cámara (foto próximamente) -->
  <g transform="translate(400 205)">
    <rect x="-78" y="-70" width="156" height="140" rx="26" fill="#ffffff" filter="url(#psh)"/>
    <!-- cuerpo cámara -->
    <rect x="-52" y="-30" width="104" height="74" rx="14" fill="none" stroke="#c62828" stroke-width="9"/>
    <!-- visor superior -->
    <path d="M-30 -30 l8 -14 h44 l8 14" fill="none" stroke="#c62828" stroke-width="9" stroke-linejoin="round"/>
    <!-- lente -->
    <circle cx="0" cy="9" r="19" fill="none" stroke="#c62828" stroke-width="9"/>
    <circle cx="0" cy="9" r="4" fill="#c62828"/>
  </g>

  <!-- Texto principal -->
  <text x="400" y="338" text-anchor="middle" font-family="'Outfit','Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="46" font-weight="700" fill="#14181f">Imagen próximamente</text>
  <!-- Subtexto -->
  <text x="400" y="378" text-anchor="middle" font-family="'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="22" font-weight="500" fill="#6b7280">Foto referencial · CONINC</text>
</svg>
