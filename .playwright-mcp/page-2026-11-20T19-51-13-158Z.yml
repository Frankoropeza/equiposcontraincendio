          - paragraph [ref=f7e269]: El ERA requiere aprobación NIOSH bajo 42 CFR 84 antes de la certificación NFPA. El nivel CBRN se identifica con el sufijo «CBRN» en el número de aprobación cuando corresponde. La NFPA es referencia técnica, no ley en México.
