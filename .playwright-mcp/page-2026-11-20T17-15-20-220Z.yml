      - generic [ref=f5e46]:
        - generic [ref=f5e47]:
          - heading "Distribuidores certificados NFPA desde 2010" [level=2] [ref=f5e48]
          - paragraph [ref=f5e49]:
            - text: Hemos equipado más de 500
            - strong [ref=f5e50]: estaciones de bomberos
            - text: en los 32 estados, desde cuerpos municipales con presupuesto ajustado hasta brigadas industriales de PEMEX y CFE. Catálogo directo de
            - strong [ref=f5e51]: MSA, Honeywell, Globe y Bullard
            - text: ": los fabricantes que certifican con"
            - strong [ref=f5e52]: NFPA 1970 (cap. 5–9 y 15–19) y NFPA 1950
            - text: . Cada pedido incluye ficha técnica y certificado de laboratorio del producto.
        - generic [ref=f5e53]:
          - heading "Por qué los jefes de cuerpo nos contactan antes de abrir una licitación" [level=2] [ref=f5e54]
          - paragraph [ref=f5e55]:
            - text: Comprar EPP certificado involucra jefes de cuerpo, protección civil municipal y, en muchos casos, un proceso de adquisición pública. Asesoramos desde la especificación técnica hasta la documentación que necesita el área de compras. Si el proveedor anterior entregó equipo sin
            - strong [ref=f5e56]: NFPA 1970
            - text: versión vigente, lo detectamos antes de que llegue a campo. Por eso nos buscan estaciones en Pachuca, Guadalajara, Monterrey, Puebla y CDMX.
