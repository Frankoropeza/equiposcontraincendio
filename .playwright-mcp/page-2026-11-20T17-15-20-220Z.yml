        - paragraph [ref=f5e790]: "La cámara termográfica TIC no es un accesorio — es el instrumento que le permite al bombero orientarse en cero visibilidad, localizar víctimas a través del humo y detectar puntos de reignición ocultos antes de dar por controlado un incendio. Su ausencia en operación no es una limitación técnica: es un riesgo operativo documentado."
        - paragraph [ref=f5e791]: Cámaras TIC con resolución de 320×240 px o superior, detectores multigas de 4 a 6 canales simultáneos (LEL, O₂, CO, H₂S y opciones CBRN) y drones de reconocimiento con cámara térmica integrada para evaluación de perímetro sin exposición del personal. Cada equipo incluye soporte técnico y garantía de fábrica en México.
