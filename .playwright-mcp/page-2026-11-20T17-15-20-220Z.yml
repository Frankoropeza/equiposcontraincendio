        - 'heading "Capuchas para Bomberos Certificadas NFPA 1970: Nomex®, PBI Gold® y Protección Particulada" [level=2] [ref=f5e815]':
          - text: "Capuchas para Bomberos Certificadas NFPA 1970:"
          - generic [ref=f5e816]: Nomex®, PBI Gold® y Protección Particulada
        - paragraph [ref=f5e817]: La capucha es el componente que cierra el sistema EPP entre el cuello del traje y el borde inferior del casco. Una brecha en ese sello no es un detalle de confort — es una vía de entrada directa del calor convectivo hacia la vía aérea y las orejas. La NFPA 1970 la certifica como componente independiente por esa razón.
        - paragraph [ref=f5e818]: Nomex® para operación estructural estándar, PBI Gold® para escenarios de mayor exposición térmica donde se requiere el mismo material del traje, y capucha con membrana particulada para entornos con alto contenido de fibras y partículas cancerígenas — un riesgo documentado en el combate de incendios estructurales modernos. Cada modelo verifica compatibilidad de sello con la máscara SCBA antes de despacho.
