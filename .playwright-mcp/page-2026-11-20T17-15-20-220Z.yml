        - paragraph [ref=f5e586]: Categoría Principal · Protección Estructural
        - 'heading "Trajes de Bombero Certificados NFPA: La Primera Línea de Defensa" [level=2] [ref=f5e587]':
          - text: "Trajes de Bombero Certificados NFPA:"
          - generic [ref=f5e588]: La Primera Línea de Defensa
        - paragraph [ref=f5e589]: El traje de bombero es el componente de EPP que determina si el elemento puede entrar al fuego o no. Las 5 configuraciones que cubre la normativa NFPA — desde el traje estructural urbano hasta el traje encapsulado Nivel A para HAZMAT — con certificado de laboratorio acreditado por número de lote.
        - paragraph [ref=f5e590]: "Los materiales no son una decisión comercial: los dicta la norma. Nomex® y PBI Gold® en la capa externa, Crosstech® o Gore-Tex® como barrera de humedad, y Caldura® o Aralite® en el forro térmico. La certificación NFPA 1970 valida el sistema completo, no las telas de forma aislada."
        - list "Tipos de traje disponibles" [ref=f5e591]:
