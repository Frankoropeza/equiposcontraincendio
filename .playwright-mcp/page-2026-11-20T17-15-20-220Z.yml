        - 'heading "Extintores Certificados NOM-100: PQS, CO₂, AFFF y Halotron para Cada Clase de Fuego" [level=2] [ref=f5e867]':
          - text: "Extintores Certificados NOM-100:"
          - generic [ref=f5e868]: PQS, CO₂, AFFF y Halotron para Cada Clase de Fuego
        - paragraph [ref=f5e869]: Seleccionar un extintor por precio o tamaño sin considerar la clase de fuego y el agente extintor es el error más frecuente — y el más costoso — en la adquisición de equipo contra incendios. Un extintor PQS aplicado sobre un incendio eléctrico puede propagar el fuego en lugar de controlarlo. La NOM-100-SCFI es el estándar que define el agente, la capacidad y la presión de trabajo adecuados para cada escenario.
        - paragraph [ref=f5e870]: "Extintores certificados NOM-100 en todas las clases: Polvo Químico Seco multipropósito para Clase A-B-C, CO₂ para equipos eléctricos y salas de servidores, espuma AFFF para Clase B en instalaciones con líquidos inflamables, y Halotron de agente limpio donde el daño residual del agente extintor es inaceptable. Cada unidad incluye garantía, tarjeta de inspección y capacitación de uso básico sin costo."
