        - paragraph [ref=f5e761]: "En un rescate vehicular, la herramienta determina el tiempo de acceso al paciente. Una cizalla con fuerza de corte insuficiente para el acero de alta resistencia de los vehículos modernos no es un problema técnico — es un problema clínico: cada minuto adicional dentro del vehículo reduce las probabilidades de supervivencia del paciente atrapado."
        - paragraph [ref=f5e762]: Holmatro y Genesis diseñan herramientas específicamente para la generación actual de carrocerías con acero Boron y aluminio de alta resistencia. Cizallas con fuerza de corte de hasta 1,500 kN, expansores con apertura de 750 mm y sistemas de alimentación monobomba o de dos circuitos independientes. Cada equipo cumple NFPA 1936 y viene con manual de mantenimiento en español, kit de sellos y soporte técnico directo de fabricante en México.
