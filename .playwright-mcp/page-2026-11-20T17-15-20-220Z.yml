        - paragraph [ref=f5e732]: "El incendio forestal no tiene la misma dinámica que el incendio estructural. Las temperaturas son menores pero la exposición es prolongada, el terreno es irregular y la movilidad del elemento es crítica. El EPP forestal resuelve esa combinación: ligero, transpirable y certificado NFPA 1950."
        - paragraph [ref=f5e733]: "El sistema completo de EPP forestal certificado: traje Nomex® NFPA 1950, casco con protección facial, guantes resistentes al calor y bota de cuero con suela Vibram® de alto agarre. Todo compatible con los requerimientos de brigadas CONAFOR y los estándares de protección civil estatal para incendios forestales en México."
