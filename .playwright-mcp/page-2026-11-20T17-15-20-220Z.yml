        - paragraph [ref=f5e649]: El SCBA es el equipo que define el tiempo operativo del bombero dentro de una atmósfera IDLH. La diferencia entre un cilindro de 30 y uno de 45 minutos no es solo duración — implica peso, perfil de espalda, compatibilidad con el traje y tipo de operación para el que está diseñado.
        - paragraph [ref=f5e650]: MSA Safety y Honeywell First Responder Products — dos de los tres fabricantes con mayor presencia en cuerpos de bomberos latinoamericanos. Cada equipo incluye máscara panorámica, alarma PASS integrada y certificado NFPA 1970 con edición de norma vigente. Compatible con los cascos y capuchas del catálogo.
