        - 'heading "Equipo HAZMAT y CBRN: Trajes Nivel A y B, Descontaminación" [level=2] [ref=f5e896]':
          - text: "Equipo HAZMAT y CBRN:"
          - generic [ref=f5e897]: Trajes Nivel A y B, Descontaminación
        - paragraph [ref=f5e898]: Una respuesta HAZMAT sin equipo de nivel adecuado no es una respuesta — es una exposición con consecuencias legales, médicas y operativas para el cuerpo. El Nivel A encapsulado protege contra gases, vapores y líquidos; el Nivel B proporciona protección respiratoria completa con menor protección de piel. La diferencia no es de grado — es de escenario de exposición.
        - paragraph [ref=f5e899]: Trajes encapsulados NFPA 1991 Nivel A para agentes CBRN, trajes Nivel B para vapores y aerosoles con menor presión de vapor, y kits de descontaminación rápida para el corredor de decon en el perímetro del incidente. Cada equipo se entrega con protocolo de donning y doffing, lista de compatibilidad química y fecha de vencimiento de fábrica verificada.
