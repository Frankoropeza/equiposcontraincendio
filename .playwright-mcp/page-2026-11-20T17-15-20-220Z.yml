    - generic [ref=f5e38]:
      - generic [ref=f5e39]:
        - generic [ref=f5e40]: Distribuidores Especializados NFPA · México
        - heading "Equipo para Bomberos en México" [level=1] [ref=f5e41]: Equipo para Bomberosen México
        - paragraph [ref=f5e42]: En 15 años hemos equipado más de 500 estaciones en toda la República. Asesoría técnica, certificados de laboratorio y envío a los 32 estados incluidos en cada pedido.
        - generic [ref=f5e43]:
          - link "Catálogo de equipo para bomberos" [ref=f5e44] [cursor=pointer]:
