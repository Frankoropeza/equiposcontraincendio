        - paragraph [ref=e27]: "Trajes estructurales, de brigadista, forestales, de aproximación, de entrada y de extricación: el traje contra incendio que corresponde a cada riesgo. Sumamos el casco, las botas, los guantes, la monja, los tirantes y el ERA que completan el conjunto. Ficha técnica y factura en cada cotización; envío a los 32 estados."
      - generic [ref=e29]:
        - paragraph [ref=e30]: "En LORICA somos especialistas en una sola línea desde hace más de 35 años: ropa de protección para combate de incendios. Equipamos brigadas industriales obligadas por la NOM-002-STPS-2010, cuerpos de bomberos municipales que compran por licitación y unidades de protección civil en los 32 estados de la República."
