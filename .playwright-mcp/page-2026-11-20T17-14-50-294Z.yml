        - generic [ref=f4e243]:
          - heading "1. Qué incluye el combo" [level=3] [ref=f4e244]
          - paragraph [ref=f4e245]: "Chaquetón, pantalón, casco, guantes, botas y escafandra. Pide el desglose por pieza, no un precio global: así compras puede comparar partida por partida y reponer solo lo que se gasta."
          - heading "2. El alcance, declarado por escrito" [level=3] [ref=f4e246]
          - paragraph [ref=f4e247]: La ficha tiene que decir para qué está pensado el traje. Sirve para conato, primera respuesta y evacuación; hasta ahí llega, y está bien que llegue hasta ahí. Si la propuesta dice «uso estructural», exige la certificación del conjunto.
          - heading "3. Tallas por persona" [level=3] [ref=f4e248]
          - paragraph [ref=f4e249]: La brigada cambia de integrantes.
          - heading "Al comprar" [level=4] [ref=f4e250]
          - paragraph [ref=f4e251]: Toma la talla de cada brigadista; no calcules por promedio.
          - heading "Al reponer" [level=4] [ref=f4e252]
          - paragraph [ref=f4e253]: Pregunta por la disponibilidad de reposición y el rango de tallas, para que quien entra reciba su equipo sin esperar.
